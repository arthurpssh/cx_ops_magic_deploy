<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar macro | Gerenciador de Macros</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/quill/quill.snow.css">
  <link rel="stylesheet" href="/vendor/choices/styles/choices.min.css">
  <link rel="stylesheet" href="/css/globals.css">
</head>
<body>
  <header class="app-header">
    <h2>Gerenciador de macros</h2>
    <nav>
      <a class="btn" href="/">Início</a>
      <a class="btn" href="/macros/create">Criar nova macro</a>
      <a class="btn" href="/macros/search">Buscar macros</a>
    </nav>
  </header>

  <div id="loading-overlay">
    <div class="main-spinner"></div>
    <p>Carregando dados da macro...</p>
  </div>

  <main class="page">
    <div class="card accent" id="edit-card">
      <div class="card-header">
        <h2 id="edit-heading">Editar macro</h2>
        <select id="select-active" class="compact" aria-label="Status da macro">
          <option value="true">Ativa</option>
          <option value="false">Inativa</option>
        </select>
      </div>

      <div class="form-group">
        <label for="base-title">Título da macro</label>
        <input type="text" id="base-title" autocomplete="off">
      </div>

      <div class="form-group grid grid-3">
        <div>
          <span class="field-label">Equipe</span>
          <select id="sel-equipe" multiple></select>
        </div>
        <div>
          <label class="field-label" for="sel-funcao">Função</label>
          <select id="sel-funcao"></select>
        </div>
        <div>
          <label class="field-label" for="sel-idioma">Idioma</label>
          <select id="sel-idioma"></select>
        </div>
      </div>

      <div class="form-group">
        <label for="textarea-description">Descrição da macro</label>
        <textarea id="textarea-description" rows="4" placeholder="Descreva a macro, informando objetivo, público-alvo, ferramenta ou funcionalidade em questão..."></textarea>
        <p class="hint">Uso interno: fica registrada na base de macros.</p>
      </div>

      <div class="form-group">
        <span class="field-label">Ações</span>
        <div id="actions-list"></div>
        <button type="button" id="btn-add-action" class="btn">Adicionar ação</button>
      </div>
    </div>
  </main>

  <div class="fixed-footer">
    <div class="inner">
      <button id="btn-update" class="btn btn-accent">
        <span>Atualizar</span>
        <span class="spinner"></span>
      </button>
    </div>
  </div>

  <script src="/vendor/quill/quill.js"></script>
  <script src="/vendor/choices/scripts/choices.min.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/macro-editor.js"></script>
  <script src="/macros/edit/script.js"></script>
</body>
</html>
