name: gerenciador-de-macros

containerPort: 3001
cpu: 0.25
memory: 256Mi

replicaCount: 1

healthCheckPath: /api/health
periodSeconds: 30
timeoutSeconds: 5
successThreshold: 2
failureThreshold: 5

env:
  PROFILE: staging
  PORT: "3001"
  NEW_RELIC_ENABLED: "false"
  GOOGLE_CLIENT_EMAIL:
    secretKeyRef:
      name: gerenciador-de-macros-google-client-email
      key: GOOGLE_CLIENT_EMAIL
  GOOGLE_PRIVATE_KEY:
    secretKeyRef:
      name: gerenciador-de-macros-google-private-key
      key: GOOGLE_PRIVATE_KEY
  MACROS_SPREADSHEET_ID:
    secretKeyRef:
      name: gerenciador-de-macros-macros-spreadsheet-id
      key: MACROS_SPREADSHEET_ID
  ZENDESK_CLIENT_ID:
    secretKeyRef:
      name: gerenciador-de-macros-zendesk-client-id
      key: ZENDESK_CLIENT_ID
  ZENDESK_CLIENT_SECRET:
    secretKeyRef:
      name: gerenciador-de-macros-zendesk-client-secret
      key: ZENDESK_CLIENT_SECRET
  # Fallback legado (usado só se o OAuth acima não estiver configurado). Remover após validar o OAuth.
  ZENDESK_BASIC_TOKEN:
    secretKeyRef:
      name: gerenciador-de-macros-zendesk-basic-token
      key: ZENDESK_BASIC_TOKEN
  ZENDESK_BASE_URL: "https://suportehotmart.zendesk.com/api/v2"
  ZENDESK_OAUTH_SCOPE: "read write tickets:read macros:read macros:write"
  MAINTENANCE_MODE: "false"

lb:
  type: internal
  annotations:
    nginx.ingress.kubernetes.io/auth-url: "https://auth.hotmart.run/verify"
    nginx.ingress.kubernetes.io/auth-signin: "https://auth.hotmart.run/login?rd=https://$host$request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-Email,X-Auth-Request-User"
  hosts:
  - host: gerenciador-de-macros.hotmart.run
    paths: ["/"]

imports:
- to: module.base-module.aws_ecr_repository.application-default-ecr[0]
  id: "gerenciador-de-macros"
