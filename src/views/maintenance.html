<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Macros - Manutenção</title>
  <style>
    * { box-sizing: border-box; font-family: 'DM Sans', system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F5F3EF; padding: 20px; }
    .panel { background: #fff; padding: 40px; border-radius: 8px; box-shadow: 0 2px 4px rgba(0,0,0,.1); border-top: 8px solid #FF4000; text-align: center; max-width: 500px; width: 100%; }
    .icon { font-size: 50px; margin-bottom: 15px; }
    h3 { font-size: 24px; color: #333; margin: 0 0 15px; }
    p { color: #666; font-size: 16px; line-height: 1.5; margin: 0; }
  </style>
</head>
<body>
  <div class="panel">
    <div class="icon">🚧</div>
    <h3>Estamos em manutenção</h3>
    <p>O Gerenciador de Macros está passando por melhorias no momento. Por favor, tente acessar novamente mais tarde.</p>
  </div>
</body>
</html>
